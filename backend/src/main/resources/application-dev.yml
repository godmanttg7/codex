spring:
  datasource:
    url: ${DB_URL:jdbc:dm://localhost:5236/TOILET_DB}
    username: ${DB_USERNAME:SYSDBA}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:dm.jdbc.driver.DmDriver}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-env}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
